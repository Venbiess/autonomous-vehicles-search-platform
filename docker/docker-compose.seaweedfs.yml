services:
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: "prometheus-${USER}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./server/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - avsp-net

  grafana:
    image: grafana/grafana-oss:11.1.4
    container_name: "grafana-${USER}"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./server/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./server/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3004:3000"
    networks:
      - avsp-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: "cadvisor-${USER}"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - avsp-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: "rabbitmq-${USER}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - avsp-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "avsp-clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9003:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - avsp-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - avsp-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.74
    container_name: "avsp-seaweedfs-master-${USER}"
    command: "weed master -ip=seaweedfs-master -mdir=/data"
    volumes:
      - seaweedfs-master-data:/data
    ports:
      - "9333:9333"
    networks:
      - avsp-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.74
    container_name: "avsp-seaweedfs-volume-${USER}"
    depends_on:
      - seaweedfs-master
    command: "weed volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -dir=/data"
    volumes:
      - seaweedfs-volume-data:/data
    ports:
      - "8080:8080"
    networks:
      - avsp-net

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.74
    container_name: "avsp-seaweedfs-filer-${USER}"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    command: "weed filer -master=seaweedfs-master:9333"
    ports:
      - "8888:8888"
    networks:
      - avsp-net

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.74
    container_name: "avsp-seaweedfs-s3-${USER}"
    depends_on:
      - seaweedfs-filer
    command: "weed s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333 -config=/etc/seaweedfs/s3-config.json"
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    ports:
      - "8333:8333"
    networks:
      - avsp-net

  embedder-worker:
    image: avsp-models-cpu
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker embedder
      "
    volumes:
      - ../:/app
    expose:
      - "8000"
      - "9108"
    environment:
      EMBEDDER_PORT: 8000
      WORKER_METRICS_PORT: 9108
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
    networks:
      - avsp-net

  vlm-worker:
    image: avsp-models-cpu
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker vlm
      "
    volumes:
      - ../:/app
    expose:
      - "8001"
      - "9109"
    environment:
      VLM_PORT: 8001
      WORKER_METRICS_PORT: 9109
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
    networks:
      - avsp-net

  storage-server:
    image: avsp-storage
    build:
      context: ..
      dockerfile: docker/storage/storage-server.Dockerfile
    container_name: "avsp-storage-${USER}"
    depends_on:
      postgres:
        condition: service_started
      seaweedfs-s3:
        condition: service_started
      clickhouse:
        condition: service_healthy
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
      OBJECT_STORE_PROVIDER: seaweedfs
      OBJECT_STORE_ENDPOINT_URL: http://seaweedfs-s3:8333
      OBJECT_STORE_ACCESS_KEY: seaweedfs
      OBJECT_STORE_SECRET_KEY: seaweedfs-secret
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_USE_SSL: "false"
      OBJECT_STORE_FORCE_PATH_STYLE: "true"
    volumes:
      - ../storage/config:/app/storage/config:ro
    ports:
      - "9013:9012"
    networks:
      - avsp-net

  avsp-server:
    build:
      context: ..
      dockerfile: docker/server/server.Dockerfile
    image: avsp-analytics-service
    container_name: "avsp-analytics-service-${USER}"
    depends_on:
      - postgres
      - seaweedfs-s3
      - rabbitmq
      - embedder-worker
      - vlm-worker
      - storage-server
    volumes:
      - ../:/app
      - "vscode-server:/root/.vscode-server"
    ports:
      - "9002:9002"
    command: >
      /bin/sh -c "
      uvicorn backend.server.master:app
      --host 0.0.0.0
      --port 9002
      --log-level debug
      --reload
      "
    environment:
      S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      S3_ACCESS_KEY_ID: seaweedfs
      S3_SECRET_ACCESS_KEY: seaweedfs-secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EMBEDDER_ENDPOINT: http://embedder-worker:8000
      EMBEDDER_ENDPOINTS: http://embedder-worker:8000
      MODEL_EXECUTION_MODE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_RPC_TIMEOUT_SEC: 120
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_TIMEOUT_SEC: 30
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_SERVER_TIMEOUT_SEC: 30
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
    networks:
      - avsp-net

  frontend:
    image: node:20
    container_name: "avsp-frontend-${USER}"
    depends_on:
      - avsp-server
    working_dir: /app/frontend
    command: >
      /bin/sh -c '
      set -e;
      ulimit -c 0;
      LOCK_HASH="$$(sha256sum package-lock.json | awk "{print \$$1}")";
      if [ ! -f node_modules/.lockhash ] || [ "$$(cat node_modules/.lockhash)" != "$$LOCK_HASH" ]; then
        echo "Installing frontend deps (lockfile changed or first run)...";
        npm ci --no-audit --no-fund;
        echo "$$LOCK_HASH" > node_modules/.lockhash;
      else
        echo "Reusing existing frontend deps from volume";
      fi;
      npm run dev -- --hostname 0.0.0.0 --webpack
      '
    volumes:
      - ../frontend:/app/frontend
      - "frontend-node-modules:/app/frontend/node_modules"
    ports:
      - "3000:3000"
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      MASTER_ENDPOINT: http://avsp-server:9002
      MASTER_PROXY_TIMEOUT_MS: 10000
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
      OBJECT_STORE_PUBLIC_ENDPOINT: http://localhost:8333
      OBJECT_STORE_DEFAULT_BUCKET: avsp
      MINIO_PUBLIC_ENDPOINT: http://localhost:8333
      MINIO_BUCKET: avsp
      NODE_OPTIONS: --max-old-space-size=16384
      FRONTEND_REQUEST_TIMEOUT_MS: "0"
      STORAGE_TRANSFER_IMPORT_MAX_BYTES: "17179869184"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - avsp-net

volumes:
  clickhouse-data:
  frontend-node-modules:
  grafana-data:
  postgres-data:
  prometheus-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  vscode-server:

networks:
  avsp-net:
    driver: bridge
