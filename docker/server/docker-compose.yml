services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: "rabbitmq-${USER}"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - avsp-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9003:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - avsp-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - avsp-net

  minio:
    image: minio/minio:latest
    container_name: "minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - avsp-net

  minio-init:
    image: minio/mc:latest
    container_name: "minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse avsp synthetic; do
        mc mb --ignore-existing local/$$bucket;
        mc anonymous set download local/$$bucket;
      done
      '
    networks:
      - avsp-net

  embedder:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "embedder-${USER}"
    profiles: ["http"]
    volumes:
      - "${PWD}/../..:/app"
    ports:
      - "8000:8000"
    networks:
      - avsp-net

  vlm:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "vlm-${USER}"
    profiles: ["http"]
    volumes:
      - "${PWD}/../..:/app"
    command: >
      /bin/sh -c "
      uvicorn backend.models.vlm.vlm:app
      --host 0.0.0.0
      --port 8001
      --log-level debug
      --reload
      "
    ports:
      - "8001:8001"
    networks:
      - avsp-net

  embedder-worker:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "embedder-worker-${USER}"
    depends_on:
      - rabbitmq
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker embedder
      "
    volumes:
      - "${PWD}/../..:/app"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
    networks:
      - avsp-net

  vlm-worker:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "vlm-worker-${USER}"
    depends_on:
      - rabbitmq
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker vlm
      "
    volumes:
      - "${PWD}/../..:/app"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
    networks:
      - avsp-net

  storage-server:
    build:
      context: ../..
      dockerfile: docker/storage/storage-server.Dockerfile
    container_name: "storage-server-${USER}"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
    ports:
      - "9013:9012"
    networks:
      - avsp-net

  avsp-server:
    build:
      context: ../..
      dockerfile: docker/server/server.Dockerfile
    image: avsp-server
    container_name: "avsp-server-${USER}"
    depends_on:
      - postgres
      - minio
      - minio-init
      - rabbitmq
      - embedder-worker
      - vlm-worker
      - storage-server
    volumes:
      - "${PWD}/../..:/app"
      - "vscode-server:/root/.vscode-server"
    ports:
      - "9002:9002"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EMBEDDER_ENDPOINT: http://embedder:8000
      VLM_ENDPOINT: http://vlm:8001
      MODEL_EXECUTION_MODE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_RPC_TIMEOUT_SEC: 120
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_TIMEOUT_SEC: 30
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_SERVER_TIMEOUT_SEC: 30
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
    networks:
      - avsp-net

  frontend:
    image: node:20
    container_name: "frontend-${USER}"
    depends_on:
      - avsp-server
    working_dir: /app/frontend
    command: >
      /bin/sh -c '
      set -e;
      LOCK_HASH="$$(sha256sum package-lock.json | awk "{print \$$1}")";
      if [ ! -f node_modules/.lockhash ] || [ "$$(cat node_modules/.lockhash)" != "$$LOCK_HASH" ]; then
        echo "Installing frontend deps (lockfile changed or first run)...";
        npm ci --no-audit --no-fund;
        echo "$$LOCK_HASH" > node_modules/.lockhash;
      else
        echo "Reusing existing frontend deps from volume";
      fi;
      npm run dev -- --hostname 0.0.0.0 --webpack
      '
    volumes:
      - "${PWD}/../../frontend:/app/frontend"
      - "frontend-node-modules:/app/frontend/node_modules"
    ports:
      - "3003:3003"
    environment:
      MASTER_ENDPOINT: http://avsp-server:9002
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: avsp
      NODE_OPTIONS: --max-old-space-size=1024
    networks:
      - avsp-net

volumes:
  clickhouse-data:
  frontend-node-modules:
  minio-data:
  object-kv-data:
  postgres-data:
  vscode-server:

networks:
  avsp-net:
    driver: bridge
