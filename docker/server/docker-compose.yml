services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - avsp-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - avsp-net

  minio:
    image: minio/minio:latest
    container_name: "minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - avsp-net

  minio-init:
    image: minio/mc:latest
    container_name: "minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse avsp; do
        mc mb --ignore-existing local/$$bucket;
        mc anonymous set download local/$$bucket;
      done
      '
    networks:
      - avsp-net

  embedder:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "embedder-${USER}"
    volumes:
      - "${PWD}/../..:/app"
    ports:
      - "8000:8000"
    networks:
      - avsp-net

  vlm:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "vlm-${USER}"
    volumes:
      - "${PWD}/../..:/app"
    command: >
      /bin/sh -c "
      uvicorn backend.models.vlm.vlm:app
      --host 0.0.0.0
      --port 8001
      --log-level debug
      --reload
      "
    ports:
      - "8001:8001"
    networks:
      - avsp-net

  object-server:
    build:
      context: ../..
      dockerfile: docker/storage/object-server.Dockerfile
    container_name: "object-server-${USER}"
    depends_on:
      - minio
      - minio-init
    volumes:
      - object-kv-data:/data
    environment:
      STORAGE_CONFIG_PATH: /app/backend/storage/config/storage.yaml
    ports:
      - "9010:9010"
    networks:
      - avsp-net

  vector-server:
    build:
      context: ../..
      dockerfile: docker/storage/vector-server.Dockerfile
    container_name: "vector-server-${USER}"
    depends_on:
      - postgres
    environment:
      STORAGE_CONFIG_PATH: /app/backend/storage/config/storage.yaml
    ports:
      - "9011:9011"
    networks:
      - avsp-net

  analytics-server:
    build:
      context: ../..
      dockerfile: docker/storage/analytics-server.Dockerfile
    container_name: "analytics-server-${USER}"
    depends_on:
      - clickhouse
    environment:
      STORAGE_CONFIG_PATH: /app/backend/storage/config/storage.yaml
    ports:
      - "9012:9012"
    networks:
      - avsp-net

  avsp-server:
    build:
      context: ../..
      dockerfile: docker/server/server.Dockerfile
    image: avsp-server
    container_name: "avsp-server-${USER}"
    depends_on:
      - postgres
      - minio
      - minio-init
      - embedder
      - vlm
      - object-server
      - vector-server
      - analytics-server
    volumes:
      - "${PWD}/../..:/app"
      - "vscode-server:/root/.vscode-server"
    ports:
      - "9002:9002"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EMBEDDER_ENDPOINT: http://embedder:8000
      VLM_ENDPOINT: http://vlm:8001
      ANALYTICS_SERVER_ENDPOINT: http://analytics-server:9012
      ANALYTICS_SERVER_TIMEOUT_SEC: 30
      OBJECT_SERVER_ENDPOINT: http://object-server:9010
      OBJECT_SERVER_TIMEOUT_SEC: 30
      VECTOR_SERVER_ENDPOINT: http://vector-server:9011
      VECTOR_SERVER_TIMEOUT_SEC: 30
    networks:
      - avsp-net

  frontend:
    image: node:20
    container_name: "frontend-${USER}"
    depends_on:
      - avsp-server
    working_dir: /app/frontend
    command: /bin/sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - "${PWD}/../../frontend:/app/frontend"
      - "frontend-node-modules:/app/frontend/node_modules"
    ports:
      - "3000:3000"
    environment:
      MASTER_ENDPOINT: http://avsp-server:9002
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: avsp
    networks:
      - avsp-net

volumes:
  clickhouse-data:
  frontend-node-modules:
  minio-data:
  object-kv-data:
  postgres-data:
  vscode-server:

networks:
  avsp-net:
    driver: bridge
