version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - avsp-net

  minio:
    image: minio/minio:latest
    container_name: "minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - avsp-net

  minio-init:
    image: minio/mc:latest
    container_name: "minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse avsp; do
        mc mb --ignore-existing local/$$bucket;
        mc anonymous set download local/$$bucket;
      done
      '
    networks:
      - avsp-net

  embedder:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "embedder-${USER}"
    volumes:
      - "${PWD}/../..:/app"
    ports:
      - "8000:8000"
    networks:
      - avsp-net

  vlm:
    build:
      context: ../..
      dockerfile: docker/models/models-cpu.Dockerfile
    container_name: "vlm-${USER}"
    volumes:
      - "${PWD}/../..:/app"
    command: >
      /bin/sh -c "
      uvicorn backend.models.vlm.vlm:app
      --host 0.0.0.0
      --port 8001
      --log-level debug
      --reload
      "
    ports:
      - "8001:8001"
    networks:
      - avsp-net

  avsp-server:
    build:
      context: ../..
      dockerfile: docker/server/server.Dockerfile
    image: avsp-server
    container_name: "avsp-server-${USER}"
    depends_on:
      - postgres
      - minio
      - minio-init
      - embedder
      - vlm
    volumes:
      - "${PWD}/../..:/app"
      - "vscode-server:/root/.vscode-server"
    ports:
      - "9002:9002"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: waymo-processed
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EMBEDDER_ENDPOINT: http://embedder:8000
      VLM_ENDPOINT: http://vlm:8001
    networks:
      - avsp-net

  frontend:
    image: node:20
    container_name: "frontend-${USER}"
    depends_on:
      - avsp-server
      - minio
    working_dir: /app/frontend
    command: /bin/sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - "${PWD}/../../frontend:/app/frontend"
      - "frontend-node-modules:/app/frontend/node_modules"
    ports:
      - "3000:3000"
    environment:
      MASTER_ENDPOINT: http://avsp-server:9002
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: avsp
    networks:
      - avsp-net

volumes:
  frontend-node-modules:
  minio-data:
  postgres-data:
  vscode-server:

networks:
  avsp-net:
    driver: bridge
