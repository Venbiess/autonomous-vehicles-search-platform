services:
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: "prometheus-${USER}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./server/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - avsp-net

  grafana:
    image: grafana/grafana-oss:11.1.4
    container_name: "grafana-${USER}"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./server/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./server/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3004:3000"
    networks:
      - avsp-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: "cadvisor-${USER}"
    privileged: true
    command:
      - --docker_only=true
      - --store_container_labels=true
      - --containerd=/run/containerd/containerd.sock
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - avsp-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: "avsp-rabbitmq-${USER}"
    hostname: rabbitmq
    user: "0:0"
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
    tmpfs:
      - /var/lib/rabbitmq
    volumes:
      - ./rabbitmq/conf.d/20-logging.conf:/etc/rabbitmq/conf.d/20-logging.conf:ro
    entrypoint: >
      /bin/sh -c "
      chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
      exec docker-entrypoint.sh rabbitmq-server
      "
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - avsp-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "avsp-clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9003:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - avsp-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avsp"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - avsp-net

  minio:
    image: minio/minio:latest
    container_name: "avsp-minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - avsp-net

  minio-init:
    image: minio/mc:latest
    container_name: "avsp-minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse nuimages nuscenes avsp synthetic; do
        mc mb --ignore-existing local/$$bucket;
        mc anonymous set download local/$$bucket;
      done
      '
    networks:
      - avsp-net

  embedder:
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
      args:
        EMBEDDER_ATTN_IMPLEMENTATION_OVERRIDE: ${EMBEDDER_ATTN_IMPLEMENTATION:-}
    container_name: "embedder-${USER}"
    profiles: ["model-http"]
    volumes:
      - ../:/app
    environment:
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    networks:
      - avsp-net

  vlm:
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
      args:
        EMBEDDER_ATTN_IMPLEMENTATION_OVERRIDE: ${EMBEDDER_ATTN_IMPLEMENTATION:-}
    container_name: "vlm-${USER}"
    profiles: ["model-http"]
    volumes:
      - ../:/app
    environment:
      HF_HOME: /app/.cache/huggingface
      VLM_DEBUG_EMPTY_OUTPUT: ${VLM_DEBUG_EMPTY_OUTPUT:-0}
    command: >
      /bin/sh -c "
      uvicorn backend.models.vlm.vlm:app --host 0.0.0.0 --port 8001 --log-level debug
      "
    ports:
      - "8001:8001"
    networks:
      - avsp-net

  embedder-worker:
    image: avsp-embedder-worker
    container_name: "avsp-embedder-worker-${USER}"
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
      args:
        EMBEDDER_ATTN_IMPLEMENTATION_OVERRIDE: ${EMBEDDER_ATTN_IMPLEMENTATION:-}
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: ${EMBEDDER_WORKER_RESTART_POLICY:-no}
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker embedder
      "
    volumes:
      - ../:/app
    expose:
      - "8000"
      - "9108"
    environment:
      EMBEDDER_PORT: 8000
      WORKER_METRICS_PORT: 9108
      LD_LIBRARY_PATH: /usr/local/lib/python3.10/site-packages/nvidia/cuda_runtime/lib:/usr/local/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:/usr/local/lib/python3.10/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.10/site-packages/nvidia/cudnn/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusparse/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusolver/lib:/usr/local/lib/python3.10/site-packages/nvidia/nccl/lib:/usr/local/lib/python3.10/site-packages/nvidia/nvjitlink/lib
      HF_HOME: /app/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "0"
      TQDM_POSITION: "-1"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
      RABBITMQ_HEARTBEAT_SEC: 900
      RABBITMQ_BLOCKED_CONNECTION_TIMEOUT_SEC: 960
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    networks:
      - avsp-net

  vlm-worker:
    image: avsp-vlm-worker
    container_name: "avsp-vlm-worker-${USER}"
    build:
      context: ..
      dockerfile: docker/models/models.Dockerfile
      args:
        EMBEDDER_ATTN_IMPLEMENTATION_OVERRIDE: ${EMBEDDER_ATTN_IMPLEMENTATION:-}
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: ${VLM_WORKER_RESTART_POLICY:-no}
    command: >
      /bin/sh -c "
      python -m backend.models.queue_worker --worker vlm
      "
    volumes:
      - ../:/app
    expose:
      - "8001"
      - "9109"
    environment:
      VLM_PORT: 8001
      VLM_DEBUG_EMPTY_OUTPUT: ${VLM_DEBUG_EMPTY_OUTPUT:-0}
      WORKER_METRICS_PORT: 9109
      LD_LIBRARY_PATH: /usr/local/lib/python3.10/site-packages/nvidia/cuda_runtime/lib:/usr/local/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:/usr/local/lib/python3.10/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.10/site-packages/nvidia/cudnn/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusparse/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusolver/lib:/usr/local/lib/python3.10/site-packages/nvidia/nccl/lib:/usr/local/lib/python3.10/site-packages/nvidia/nvjitlink/lib
      HF_HOME: /app/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "0"
      TQDM_POSITION: "-1"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_PREFETCH: 1
      RABBITMQ_HEARTBEAT_SEC: 900
      RABBITMQ_BLOCKED_CONNECTION_TIMEOUT_SEC: 960
    networks:
      - avsp-net

  storage-server:
    image: avsp-storage
    build:
      context: ..
      dockerfile: docker/storage/storage-server.Dockerfile
    container_name: "avsp-storage-${USER}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
      OBJECT_STORE_PROVIDER: s3
      OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: minioadmin
      OBJECT_STORE_SECRET_KEY: minioadmin
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_USE_SSL: "false"
      OBJECT_STORE_FORCE_PATH_STYLE: "true"
    volumes:
      - ../storage/config:/app/storage/config:ro
    ports:
      - "9013:9012"
    networks:
      - avsp-net

  master-server:
    build:
      context: ..
      dockerfile: docker/server/server.Dockerfile
    image: avsp-master
    container_name: "avsp-master-${USER}"
    depends_on:
      - postgres
      - minio
      - minio-init
      - rabbitmq
      - embedder-worker
      - vlm-worker
      - storage-server
    volumes:
      - ../:/app
      - "vscode-server:/root/.vscode-server"
    ports:
      - "9002:9002"
    command: >
      /bin/sh -c "
      if [ \"${AVSP_DEV_RELOAD:-0}\" = \"1\" ]; then
        echo 'master-server: DEV reload mode enabled';
        exec uvicorn backend.server.master:app --host 0.0.0.0 --port 9002 --log-level debug --reload --reload-dir /app/backend --reload-dir /app/configs;
      else
        exec uvicorn backend.server.master:app --host 0.0.0.0 --port 9002 --log-level debug;
      fi
      "
    environment:
      AVSP_DEV_RELOAD: ${AVSP_DEV_RELOAD:-0}
      PYTHONWARNINGS: "ignore::FutureWarning:google.api_core._python_version_support"
      CUDA_VISIBLE_DEVICES: ""
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EMBEDDER_ENDPOINT: http://embedder-worker:8000
      VLM_ENDPOINT: http://vlm-worker:8001
      EMBEDDER_ENDPOINTS: http://embedder-worker:8000
      MODEL_EXECUTION_MODE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_EMBEDDER_QUEUE: avsp.embedder.tasks
      RABBITMQ_VLM_QUEUE: avsp.vlm.tasks
      RABBITMQ_RPC_TIMEOUT_SEC: 900
      MODEL_BACKEND_READY_WAIT_SEC: ${MODEL_BACKEND_READY_WAIT_SEC:-45}
      MODEL_BACKEND_READY_POLL_SEC: ${MODEL_BACKEND_READY_POLL_SEC:-1}
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_TIMEOUT_SEC: 30
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_SERVER_TIMEOUT_SEC: 30
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
      VLM_RETRY_EMPTY_VALUES: ${VLM_RETRY_EMPTY_VALUES:-1}
      VLM_BACKFILL_FIELD_CHUNK_SIZE: ${VLM_BACKFILL_FIELD_CHUNK_SIZE:-0}
    networks:
      - avsp-net

  frontend:
    image: node:20
    container_name: "avsp-frontend-${USER}"
    depends_on:
      - master-server
    working_dir: /app/frontend
    command: >
      /bin/sh -c '
      set -e;
      ulimit -c 0;
      LOCK_HASH="$$(sha256sum package-lock.json | awk "{print \$$1}")";
      if [ ! -f node_modules/.lockhash ] || [ "$$(cat node_modules/.lockhash)" != "$$LOCK_HASH" ]; then
        echo "Installing frontend deps (lockfile changed or first run)...";
        npm ci --no-audit --no-fund;
        echo "$$LOCK_HASH" > node_modules/.lockhash;
      else
        echo "Reusing existing frontend deps from volume";
      fi;
      if [ "${AVSP_DEV_RELOAD:-0}" = "1" ]; then
        echo "frontend: DEV reload mode enabled";
        exec npm run dev -- --hostname 0.0.0.0 --port 3000;
      fi;
      rm -rf .next;
      npm run build;
      test -f .next/server/middleware-manifest.json;
      exec npm run start -- --hostname 0.0.0.0 --port 3000
      '
    volumes:
      - ../frontend:/app/frontend
      - ../storage/config:/app/storage/config
      - "frontend-node-modules:/app/frontend/node_modules"
    ports:
      - "3000:3000"
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      AVSP_DEV_RELOAD: ${AVSP_DEV_RELOAD:-0}
      MASTER_ENDPOINT: http://master-server:9002
      MASTER_PROXY_TIMEOUT_MS: 10000
      STORAGE_SERVER_ENDPOINT: http://storage-server:9012
      ANALYTICS_SERVER_ENDPOINT: http://storage-server:9012
      STORAGE_WRITE_TOKEN: change-me-storage-write-token
      OBJECT_STORE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORE_DEFAULT_BUCKET: avsp
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: avsp
      NODE_OPTIONS: --max-old-space-size=2048
      FRONTEND_REQUEST_TIMEOUT_MS: "0"
      STORAGE_TRANSFER_IMPORT_MAX_BYTES: "17179869184"
    networks:
      - avsp-net

volumes:
  clickhouse-data:
  frontend-node-modules:
  grafana-data:
  minio-data:
  postgres-data:
  prometheus-data:
  vscode-server:

networks:
  avsp-net:
    driver: bridge
