# Keep RabbitMQ logs concise in local docker runs:
# show only errors (warnings are noisy and mostly non-actionable in single-node dev mode).
log.console.level = error

# RabbitMQ 3.13 management plugin can emit a deprecation warning for
# `management_metrics_collection`. Keep it explicitly permitted for local dev.
deprecated_features.permit.management_metrics_collection = true

# Single-node local deployment: configure classic peer discovery list to include
# the current node and avoid "list of nodes does not contain the local node []".
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@localhost
