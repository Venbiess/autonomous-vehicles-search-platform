services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: "avsp-storage-etcd-${USER}"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd-1=http://0.0.0.0:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=avsp-coordinator
    volumes:
      - storage-etcd-data:/etcd-data
    ports:
      - "2379:2379"
    networks:
      - storage-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-storage-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - storage-net

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: "avsp-storage-qdrant-${USER}"
    volumes:
      - storage-qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - storage-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "avsp-storage-clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - storage-clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9100:9000"
    networks:
      - storage-net

  minio:
    image: minio/minio:latest
    container_name: "avsp-storage-minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - storage-minio-data:/data
    ports:
      - "9001:9001"
      - "9002:9000"
    networks:
      - storage-net

  minio-init:
    image: minio/mc:latest
    container_name: "avsp-storage-minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse avsp; do
        mc mb --ignore-existing local/$$bucket;
      done
      '
    networks:
      - storage-net

  object-server:
    build:
      context: ../..
      dockerfile: docker/storage/object-server.Dockerfile
    container_name: "avsp-storage-object-server-${USER}"
    depends_on:
      - minio
      - minio-init
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
    volumes:
      - storage-object-kv-data:/data
    ports:
      - "9010:9010"
    networks:
      - storage-net

  vector-server:
    build:
      context: ../..
      dockerfile: docker/storage/vector-server.Dockerfile
    container_name: "avsp-storage-vector-server-${USER}"
    depends_on:
      - postgres
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
    ports:
      - "9011:9011"
    networks:
      - storage-net

  analytics-server:
    build:
      context: ../..
      dockerfile: docker/storage/analytics-server.Dockerfile
    container_name: "avsp-storage-analytics-server-${USER}"
    depends_on:
      - clickhouse
    environment:
      COLUMN_STORAGE_CONFIG_PATH: /app/backend/column-storage/settings.yaml
    ports:
      - "9012:9012"
    networks:
      - storage-net

  coordinator-server:
    build:
      context: ../..
      dockerfile: docker/storage/coordinator-server.Dockerfile
    container_name: "avsp-storage-coordinator-server-${USER}"
    depends_on:
      - etcd
      - object-server
      - vector-server
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.yaml
    ports:
      - "9013:9013"
    networks:
      - storage-net

volumes:
  storage-etcd-data:
  storage-postgres-data:
  storage-qdrant-data:
  storage-clickhouse-data:
  storage-minio-data:
  storage-object-kv-data:

networks:
  storage-net:
    driver: bridge
