services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: "avsp-storage-postgres-${USER}"
    environment:
      POSTGRES_DB: avsp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avsp"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - storage-net

  minio:
    image: minio/minio:latest
    container_name: "avsp-storage-minio-${USER}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - storage-minio-data:/data
    ports:
      - "9001:9001"
      - "9002:9000"
    networks:
      - storage-net

  minio-init:
    image: minio/mc:latest
    container_name: "avsp-storage-minio-init-${USER}"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done &&
      for bucket in waymo argoverse nuimages nuscenes avsp; do
        mc mb --ignore-existing local/$$bucket;
      done
      '
    networks:
      - storage-net

  storage-server:
    build:
      context: ../..
      dockerfile: docker/storage/storage-server.Dockerfile
    container_name: "avsp-storage-storage-server-${USER}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      STORAGE_CONFIG_PATH: /app/storage/config/storage.pgvector.yaml
    volumes:
      - ../../storage/config:/app/storage/config:ro
    ports:
      - "9012:9012"
    networks:
      - storage-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: "avsp-storage-clickhouse-${USER}"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - storage-clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - storage-net

volumes:
  storage-postgres-data:
  storage-minio-data:
  storage-clickhouse-data:

networks:
  storage-net:
    driver: bridge
