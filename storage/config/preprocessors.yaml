preprocessors:
  - key: synthetic
    label: Synthetic Road Scenes
    description: Generate synthetic road images and upload them to storage.
    runner:
      entrypoint: python -m backend.processors.synthetic_preprocessor
      module: backend.processors.synthetic_preprocessor
    default_config:
      bucket: synthetic
      num_images: 64
      batch_size: 16
      keep_local_images: false
      embed_on_install: false

  - key: waymo
    label: Waymo Open Dataset
    description: Download Waymo camera frames, preprocess, and upload to storage.
    runner:
      entrypoint: python -m backend.processors.waymo_preprocessor
      module: backend.processors.waymo_preprocessor
    default_config:
      bucket: waymo
      cameras:
        - FRONT
      resample_seconds: 5.0
      exist_skip: true
      keep_local_images: false
      embed_on_install: false

  - key: argoverse
    label: Argoverse 2
    description: Download Argoverse parts, preprocess camera frames, and upload to storage.
    runner:
      entrypoint: python -m backend.processors.argoverse_preprocessor
      module: backend.processors.argoverse_preprocessor
    default_config:
      bucket: argoverse
      cameras:
        - FRONT
      resample_seconds: 5.0
      download_parts:
        train: [0]
        val: []
        test: []
      remove_after_load: false
      keep_local_images: false
      embed_on_install: false

  - key: nuimages
    label: NuImages (nuScenes)
    description: Read local nuImages archives/frames, preprocess, and upload camera frames to storage.
    runner:
      entrypoint: python -m backend.processors.nuimages_preprocessor
      module: backend.processors.nuimages_preprocessor
    default_config:
      bucket: nuimages
      cameras:
        - FRONT
      resample_seconds: 5.0
      image_roots:
        - sweeps
        - samples
      extract_with_progress: false
      keep_local_images: false
      embed_on_install: false

  - key: once
    label: ONCE
    description: "Read local ONCE archives or download from Google Drive, preprocess, and upload camera frames to storage. Sources: https://once-for-auto-driving.github.io/download.html#downloads and configured Google Drive split folders."
    runner:
      entrypoint: python -m backend.processors.once_preprocessor
      module: backend.processors.once_preprocessor
    default_config:
      bucket: once
      tar_dir: /app/data/once/tars
      extract_dir: /app/data/once/extracted
      out_dir: /app/data/once/filtered
      use_local_archives: true
      download_from_gdrive: false
      download_splits:
        - train
        - val
        - test
        - unlabeled_1
        - unlabeled_2
        - unlabeled_3
        - unlabeled_4
        - unlabeled_5
        - unlabeled_6
        - unlabeled_7
        - unlabeled_8
        - unlabeled_9
      cameras:
        - FRONT
      resample_seconds: 5.0
      fps: 10
      keep_local_images: false
      embed_on_install: false

  - key: bdd100k
    label: BDD100K
    description: "Read local BDD100K zip archives, preprocess, and upload camera frames to storage. Dataset: https://www.kaggle.com/datasets/alesssaulea/bdd100k?resource=download"
    runner:
      entrypoint: python -m backend.processors.bdd100k_preprocessor
      module: backend.processors.bdd100k_preprocessor
    default_config:
      bucket: bdd100k
      zip_dir: /app/data/bdd100k/zips
      extract_dir: /app/data/bdd100k/extracted
      out_dir: /app/data/bdd100k/filtered
      extract_archives: true
      splits:
        - train
        - val
        - test
      resample_seconds: 5.0
      fps: 10
      keep_local_images: false
      embed_on_install: false

  - key: drivingdojo
    label: DrivingDojo
    description: "Download DrivingDojo videos from Hugging Face or use local videos, sample frames, and upload to storage. Dataset: https://huggingface.co/datasets/Yuqi1997/DrivingDojo"
    runner:
      entrypoint: python -m backend.processors.drivingdojo_preprocessor
      module: backend.processors.drivingdojo_preprocessor
    default_config:
      bucket: drivingdojo
      repo_id: Yuqi1997/DrivingDojo
      source_dir: /app/data/drivingdojo/source
      videos_dir: /app/data/drivingdojo/source/videos
      extract_dir: /app/data/drivingdojo/source/extracted
      out_dir: /app/data/drivingdojo/filtered
      allow_patterns:
        - videos/*
      download_from_hf: true
      extract_archives: true
      hf_token: ""
      fps: 10
      max_workers: 4
      limit_videos: null
      camera_name: FRONT
      resample_seconds: 5.0
      keep_local_images: false
      embed_on_install: false
