  #     table: image_embeddings

coordinator_server:
  server_name: coordinator-server
  addr: ":9013"
  node_id: coordinator-node-1
  data_plane:
    object_endpoint: http://object-server:9010
    vector_endpoint: http://vector-server:9011
    write_token: change-me-storage-write-token
    timeout_seconds: 30
  backend:
    provider: etcd
    endpoints:
      - http://etcd:2379
    prefix: /avsp/coordinator
    lease_ttl_seconds: 10
    operation_ttl_seconds: 86400
    reconcile_interval_seconds: 15
    reconcile_batch_limit: 200
