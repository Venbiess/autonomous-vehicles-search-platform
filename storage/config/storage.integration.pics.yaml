storage_server:
  server_name: storage-server
  addr: ":9012"
  write_token: "change-me-storage-write-token"
  default_bucket: "avsp"
  preprocessors_manifest_path: "/app/storage/config/preprocessors.yaml"
  metadata_db:
    dsn: "host=postgres port=5432 dbname=avsp user=postgres password=postgres sslmode=disable"
    schema: "public"
    table: "objects"
  analytics_db:
    provider: "clickhouse"
    dsn: "clickhouse://default:clickhouse@clickhouse:8123/default"
    field_catalog_table: "vlm_field_specs"
    annotation_store_table: "vlm_annotations"
  object_cache:
    enabled: true
    max_items: 5000
    max_total_bytes: 536870912
    max_object_size_bytes: 8388608
    ttl_seconds: 120
  object_store:
    provider: "pics"
    endpoint_url: "http://pics-coordinator:9000"
    access_key: ""
    secret_key: ""
    session_token: ""
    auth_token: ""
    region: ""
    path_prefix: ""
    use_ssl: false
    force_path_style: true
  vector_index:
    provider: "pgvector"
    conn_str: "host=postgres port=5432 dbname=avsp user=postgres password=postgres sslmode=disable"
    schema: "public"
    table: "image_embeddings"
    endpoint_url: ""
    api_key: ""
    collection: ""
    distance: "cosine"
    vector_size: 0
    timeout_sec: 10
