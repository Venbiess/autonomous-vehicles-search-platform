name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/server/requirements.txt pytest

      - name: Run backend unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q backend/tests

      - name: Compile backend Python modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile \
            backend/server/master/__init__.py \
            backend/server/master/embedder.py \
            backend/server/master/job_support.py \
            backend/server/master/jobs.py \
            backend/server/master/models.py \
            backend/server/master/object_listing.py \
            backend/server/master/routes.py \
            backend/server/master/state.py \
            backend/server/master/system.py \
            backend/server/master/vlm.py \
            backend/server/master/waymo_auth.py \
            backend/server/model_bus.py \
            backend/server/storage_api.py \
            backend/server/analytics_api.py \
            backend/processors/preprocessor.py

  storage-go-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run storage Go tests
        working-directory: storage
        run: go test ./...

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint -- .

      - name: Run frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main Docker Compose file
        run: docker compose -f docker/docker-compose.yml config

  docker-build-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build storage image
        run: docker build -f docker/storage/storage-server.Dockerfile -t avsp-storage-ci .

      - name: Build server image
        run: docker build -f docker/server/server.Dockerfile -t avsp-server-ci .

  storage-integration:
    runs-on: ubuntu-latest
    needs:
      - storage-go-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pgvector
            compose_file: docker/storage/docker-compose.pgvector.yml
            ready_retries: 60
            request_timeout_sec: 20
          - name: qdrant
            compose_file: docker/storage/docker-compose.qdrant.yml
            ready_retries: 60
            request_timeout_sec: 20
          - name: milvus
            compose_file: docker/storage/docker-compose.milvus.yml
            ready_retries: 120
            request_timeout_sec: 60
          - name: ytsaurus
            compose_file: docker/storage/docker-compose.ytsaurus.yml
            ready_retries: 180
            request_timeout_sec: 20
          - name: seaweedfs
            compose_file: docker/storage/docker-compose.seaweedfs.yml
            ready_retries: 60
            request_timeout_sec: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run storage integration tests (${{ matrix.name }})
        env:
          STORAGE_TEST_COMPOSE_FILE: ${{ github.workspace }}/${{ matrix.compose_file }}
          STORAGE_READY_RETRIES: ${{ matrix.ready_retries }}
          STORAGE_TEST_TIMEOUT_SEC: ${{ matrix.request_timeout_sec }}
        run: bash storage/tests/tests.sh --down

  full-stack-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - storage-go-tests
      - docker-compose-config

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full stack smoke checks
        run: bash docker/server/ci_full_stack_smoke.sh
