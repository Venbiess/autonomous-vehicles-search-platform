{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avsp.fullname" . }}
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avsp-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
    - host: {{ .Values.ingress.hosts.master }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avsp-master
                port:
                  number: {{ .Values.master.service.port }}
    - host: {{ .Values.ingress.hosts.storage }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storage-server
                port:
                  number: {{ .Values.storageServer.service.port }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
