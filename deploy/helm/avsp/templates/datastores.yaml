{{- if .Values.milvus.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.milvus.persistence.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-data
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.milvus.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "avsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: etcd
  template:
    metadata:
      labels:
        {{- include "avsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.5
          imagePullPolicy: IfNotPresent
          command:
            - etcd
            - --advertise-client-urls=http://etcd:2379
            - --listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd
          ports:
            - containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /etcd
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: etcd-data
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "avsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: milvus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "avsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: milvus
  template:
    metadata:
      labels:
        {{- include "avsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: milvus
    spec:
      containers:
        - name: milvus
          image: {{ include "avsp.image" .Values.milvus.image }}
          imagePullPolicy: {{ .Values.milvus.image.pullPolicy }}
          command: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_ENDPOINTS
              value: etcd:2379
            - name: MINIO_ADDRESS
              value: minio:9000
          ports:
            - name: grpc
              containerPort: {{ .Values.milvus.service.port }}
            - name: http
              containerPort: {{ .Values.milvus.service.httpPort }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: milvus-data
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "avsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: milvus
  ports:
    - name: grpc
      port: {{ .Values.milvus.service.port }}
      targetPort: grpc
    - name: http
      port: {{ .Values.milvus.service.httpPort }}
      targetPort: http
{{- end }}
