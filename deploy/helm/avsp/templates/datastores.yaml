              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
