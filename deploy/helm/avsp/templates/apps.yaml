{{- if .Values.embedderWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder-worker
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: embedder-worker
spec:
  replicas: {{ .Values.embedderWorker.replicas }}
  selector:
    matchLabels:
      {{- include "avsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: embedder-worker
  template:
    metadata:
      labels:
        {{- include "avsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: embedder-worker
    spec:
      containers:
        - name: embedder-worker
          image: {{ include "avsp.image" .Values.embedderWorker.image }}
          imagePullPolicy: {{ .Values.embedderWorker.image.pullPolicy }}
          command: ["python", "-m", "backend.models.queue_worker", "--worker", "embedder"]
          env:
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/%2f
            - name: RABBITMQ_EMBEDDER_QUEUE
              value: avsp.embedder.tasks
            - name: RABBITMQ_VLM_QUEUE
              value: avsp.vlm.tasks
            - name: RABBITMQ_PREFETCH
              value: "1"
          resources:
            {{- toYaml .Values.embedderWorker.resources | nindent 12 }}
---
{{- end }}
