{{- if .Values.storageServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-server
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-server
spec:
  replicas: {{ .Values.storageServer.replicas }}
  selector:
    matchLabels:
      {{- include "avsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: storage-server
  template:
    metadata:
      labels:
        {{- include "avsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storage-server
    spec:
      containers:
        - name: storage-server
          image: {{ include "avsp.image" .Values.storageServer.image }}
          imagePullPolicy: {{ .Values.storageServer.image.pullPolicy }}
          env:
            - name: STORAGE_CONFIG_PATH
              value: /app/storage/config/storage.yaml
          ports:
            - containerPort: {{ .Values.storageServer.service.port }}
          volumeMounts:
            - name: storage-config
              mountPath: /app/storage/config/storage.yaml
              subPath: storage.yaml
            - name: storage-config
              mountPath: /app/storage/config/preprocessors.yaml
              subPath: preprocessors.yaml
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.storageServer.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.storageServer.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.storageServer.resources | nindent 12 }}
      volumes:
        - name: storage-config
          configMap:
            name: {{ include "avsp.fullname" . }}-storage-config
---
apiVersion: v1
kind: Service
metadata:
  name: storage-server
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "avsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage-server
  ports:
    - name: http
      port: {{ .Values.storageServer.service.port }}
      targetPort: {{ .Values.storageServer.service.port }}
---
{{- end }}
