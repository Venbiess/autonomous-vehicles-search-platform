    spec:
      containers:
        - name: frontend
          image: {{ include "avsp.image" .Values.frontend.image }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: MASTER_ENDPOINT
              value: http://avsp-master:9002
            - name: STORAGE_SERVER_ENDPOINT
              value: http://storage-server:9012
            - name: STORAGE_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: STORAGE_WRITE_TOKEN
            - name: MINIO_PUBLIC_ENDPOINT
              value: http://minio:9000
            - name: MINIO_BUCKET
              value: avsp
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
