{{- if .Values.master.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avsp-master
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: master
spec:
  replicas: {{ .Values.master.replicas }}
  selector:
    matchLabels:
      {{- include "avsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        {{- include "avsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: master
    spec:
      containers:
        - name: master
          image: {{ include "avsp.image" .Values.master.image }}
          imagePullPolicy: {{ .Values.master.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "avsp.fullname" . }}-secrets
          env:
            - name: S3_ENDPOINT_URL
              value: http://minio:9000
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: EMBEDDER_ENDPOINT
              value: http://embedder:8000
            - name: VLM_ENDPOINT
              value: http://vlm:8001
            - name: MODEL_EXECUTION_MODE
              value: {{ .Values.master.modelExecutionMode | quote }}
            {{- if eq .Values.master.modelExecutionMode "rabbitmq" }}
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/%2f
            - name: RABBITMQ_EMBEDDER_QUEUE
              value: avsp.embedder.tasks
            - name: RABBITMQ_VLM_QUEUE
              value: avsp.vlm.tasks
            - name: RABBITMQ_RPC_TIMEOUT_SEC
              value: "120"
            {{- end }}
            - name: STORAGE_SERVER_ENDPOINT
              value: http://storage-server:9012
            - name: STORAGE_SERVER_TIMEOUT_SEC
              value: "30"
            - name: STORAGE_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "avsp.fullname" . }}-secrets
                  key: STORAGE_WRITE_TOKEN
            - name: ANALYTICS_SERVER_ENDPOINT
              value: http://analytics-server:9012
            - name: ANALYTICS_SERVER_TIMEOUT_SEC
              value: "30"
          ports:
            - containerPort: {{ .Values.master.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.master.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.master.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: avsp-master
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "avsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
  ports:
    - name: http
      port: {{ .Values.master.service.port }}
      targetPort: {{ .Values.master.service.port }}
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avsp-frontend
  namespace: {{ include "avsp.namespace" . }}
  labels:
    {{- include "avsp.labels" . | nindent 4 }}
