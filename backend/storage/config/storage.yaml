object_server:
  server_name: object-server
  addr: ":9010"
  kv_path: /data/object-pebble
  default_bucket: avsp
  object_store:
    provider: s3
    endpoint_url: http://minio:9000
    access_key: minioadmin
    secret_key: minioadmin
    session_token: ""
    region: us-east-1
    use_ssl: false
    force_path_style: true

vector_server:
  server_name: vector-server
  addr: ":9011"
  vector_index:
    provider: pgvector
    conn_str: host=postgres port=5432 dbname=avsp user=postgres password=postgres sslmode=disable
    schema: public
    table: image_embeddings

analytics_server:
  server_name: analytics-server
  addr: ":9012"
  analytics_db:
    provider: clickhouse
    dsn: clickhouse://default:@clickhouse:9000/default
    field_catalog_table: vlm_field_specs
    annotation_store_table: vlm_annotations
